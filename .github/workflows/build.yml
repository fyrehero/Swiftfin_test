name: Build Swiftfin

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: brew install carthage swiftgen swiftformat

      # Carthage downloads VLCKit, which is very large.
      # Caching it saves ~15 minutes on repeat runs.
      - name: Cache Carthage
        uses: actions/cache@v4
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-

      - name: Install Carthage dependencies
        run: carthage update --use-xcframeworks --platform iOS

      - name: Create xcconfig (no signing)
        run: |
          mkdir -p XcodeConfig
          cat > XcodeConfig/DevelopmentTeam.xcconfig << 'EOF'
          DEVELOPMENT_TEAM = ""
          PRODUCT_BUNDLE_IDENTIFIER = org.jellyfin.swiftfin
          EOF

      - name: List schemes (for debugging)
        run: |
          xcodebuild -project Swiftfin.xcodeproj -list

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Swiftfin.xcodeproj \
            -scheme "Swiftfin" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package as IPA
        run: |
          APP_PATH=$(find DerivedData -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Swiftfin.ipa Payload
          echo "Built: $APP_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-unsigned
          path: Swiftfin.ipa
          retention-days: 7
